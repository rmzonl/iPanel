# iPanel — Web UI vhost (port 3333, SSL)
# /etc/nginx/sites-available/ipanel.conf → symlink to sites-enabled/
#
# Rate limit direktifleri (map + limit_req_zone) ayrı dosyadadır:
# /etc/nginx/conf.d/ipanel-ratelimit.conf  ← install.sh tarafından kopyalanır

server {
    listen 3333 ssl http2;
    listen [::]:3333 ssl http2;

    server_name _;

    ssl_certificate     /etc/ipanel/ssl/panel.crt;
    ssl_certificate_key /etc/ipanel/ssl/panel.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root  /usr/local/ipanel/web;
    index zeroneed.php;

    access_log /var/log/ipanel/panel.access.log;
    error_log  /var/log/ipanel/panel.error.log warn;

    # -------------------------------------------------------
    # Güvenlik başlıkları
    # -------------------------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN"                     always;
    add_header X-Content-Type-Options    "nosniff"                        always;
    add_header X-XSS-Protection          "1; mode=block"                  always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net cdnjs.cloudflare.com fonts.googleapis.com; font-src 'self' fonts.gstatic.com cdn.jsdelivr.net cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self';"
        always;

    # Sunucu bilgisini gizle
    server_tokens off;
    more_clear_headers Server;

    client_max_body_size 256M;
    client_body_timeout  30s;
    client_header_timeout 30s;
    keepalive_timeout    15s;

    # -------------------------------------------------------
    # Yüklenen kullanıcı dosyaları — statik
    # -------------------------------------------------------
    location /uploads/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # -------------------------------------------------------
    # Ana yönlendirme
    # ZN Framework URL'yi QUERY_STRING'den okuyor (REQUEST_URI'dan değil).
    # Apache .htaccess: RewriteRule ^(.*)$ zeroneed.php?/$1 [QSA]
    # Nginx karşılığı: named location @zn ile rewrite.
    # -------------------------------------------------------
    location / {
        try_files $uri $uri/ @zn;
    }

    location @zn {
        rewrite ^/(.*)$ /zeroneed.php?/$1 last;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass  unix:IPANEL_PHP_SOCK;
        fastcgi_index zeroneed.php;

        # Açık tanımlar — fastcgi_params dosyası eksik/hatalıysa ZN Framework
        # $_SERVER['REQUEST_URI'] ile SCRIPT_NAME'i doğru okuyamaz ve
        # CURRENT_CONTROLLER boş kalır → sonsuz döngü oluşur.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME     $fastcgi_script_name;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param DOCUMENT_ROOT   $document_root;

        # PHP-FPM zaman aşımı
        fastcgi_read_timeout 120s;

        # Güvenlik: PHP kaynak kodunu asla gösterme
        fastcgi_intercept_errors on;
    }

    # -------------------------------------------------------
    # Hassas dizinlere erişimi engelle
    # -------------------------------------------------------
    location ~ ^/(iApp|Packages|install|agent|bin)/ {
        deny all;
        return 403;
    }

    # Gizli dosyalar
    location ~ /\.(ht|git|env|gitignore|gitkeep) {
        deny all;
        return 403;
    }

    # Yedek / geçici dosyalar
    location ~ \.(bak|log|sql|conf|ini|sh|old)$ {
        deny all;
        return 403;
    }

    # composer dosyaları
    location ~ /(composer\.(json|lock)|package\.json|\.npmrc)$ {
        deny all;
        return 403;
    }

    # -------------------------------------------------------
    # Hız sınırlama — yalnızca POST (brute-force koruması)
    # limit_req_zone http context'te tanımlıdır:
    # /etc/nginx/conf.d/ipanel-ratelimit.conf
    # -------------------------------------------------------
    location ~ ^/auth/login {
        limit_req        zone=login burst=5 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ @zn;
    }
}
