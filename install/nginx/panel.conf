# iPanel — Web UI vhost (default port 8443 with SSL)
# Place at /etc/nginx/sites-available/ipanel.conf and symlink to sites-enabled/.

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;

    server_name _;

    ssl_certificate     /etc/ipanel/ssl/panel.crt;
    ssl_certificate_key /etc/ipanel/ssl/panel.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/local/ipanel/web;
    index zeroneed.php index.php index.html;

    access_log /var/log/ipanel/panel.access.log;
    error_log  /var/log/ipanel/panel.error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 256M;

    # Yüklenen kullanıcı dosyaları — doğrudan statik servis
    location /uploads/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /zeroneed.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/ipanel.sock;
        fastcgi_index zeroneed.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Block direct access to sensitive paths
    location ~ ^/(iApp|Packages|install|agent|bin)/ {
        deny all;
    }
    location ~ /\.(ht|git|env) {
        deny all;
    }
}
