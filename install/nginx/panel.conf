# iPanel — Web UI vhost (port 8443, SSL)
# /etc/nginx/sites-available/ipanel.conf → symlink to sites-enabled/

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;

    server_name _;

    ssl_certificate     /etc/ipanel/ssl/panel.crt;
    ssl_certificate_key /etc/ipanel/ssl/panel.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root  /usr/local/ipanel/web;
    index zeroneed.php;

    access_log /var/log/ipanel/panel.access.log;
    error_log  /var/log/ipanel/panel.error.log warn;

    # -------------------------------------------------------
    # Güvenlik başlıkları
    # -------------------------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN"                     always;
    add_header X-Content-Type-Options    "nosniff"                        always;
    add_header X-XSS-Protection          "1; mode=block"                  always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net cdnjs.cloudflare.com fonts.googleapis.com; font-src 'self' fonts.gstatic.com cdn.jsdelivr.net cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self';"
        always;

    # Sunucu bilgisini gizle
    server_tokens off;
    more_clear_headers Server;

    client_max_body_size 256M;
    client_body_timeout  30s;
    client_header_timeout 30s;
    keepalive_timeout    15s;

    # -------------------------------------------------------
    # Yüklenen kullanıcı dosyaları — statik
    # -------------------------------------------------------
    location /uploads/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # -------------------------------------------------------
    # Ana yönlendirme
    # -------------------------------------------------------
    location / {
        try_files $uri $uri/ /zeroneed.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass  unix:/run/php/ipanel.sock;
        fastcgi_index zeroneed.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # PHP-FPM zaman aşımı
        fastcgi_read_timeout 120s;

        # Güvenlik: PHP kaynak kodunu asla gösterme
        fastcgi_intercept_errors on;
    }

    # -------------------------------------------------------
    # Hassas dizinlere erişimi engelle
    # -------------------------------------------------------
    location ~ ^/(iApp|Packages|install|agent|bin)/ {
        deny all;
        return 403;
    }

    # Gizli dosyalar
    location ~ /\.(ht|git|env|gitignore|gitkeep) {
        deny all;
        return 403;
    }

    # Yedek / geçici dosyalar
    location ~ \.(bak|log|sql|conf|ini|sh|old)$ {
        deny all;
        return 403;
    }

    # composer dosyaları
    location ~ /(composer\.(json|lock)|package\.json|\.npmrc)$ {
        deny all;
        return 403;
    }

    # -------------------------------------------------------
    # Hız sınırlama (nginx seviyesi)
    # -------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    location ~ ^/auth/login {
        limit_req zone=login burst=3 nodelay;
        try_files $uri $uri/ /zeroneed.php?$query_string;
    }
}
