# iPanel — HTTP context rate limit direktifleri
# install.sh tarafından /etc/nginx/conf.d/ipanel-ratelimit.conf olarak kopyalanır.
# Her iki OS'ta da nginx bu dizini http context'te yükler.
#
# map bloğu: yalnızca POST isteklerini zone'a sokar.
# GET/HEAD login sayfası açılışları sayılmaz → 503/429 riski yok.

map $request_method $login_limit_key {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $login_limit_key zone=login:10m rate=10r/m;
limit_req_status 429;
